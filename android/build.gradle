buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

def autografoAds = new Properties()
def autografoAdsFile = file('autografo-ads.properties')
if (autografoAdsFile.exists()) {
    autografoAdsFile.withInputStream { autografoAds.load(it) }
}
def autografoEnableAds = (autografoAds.getProperty('enable', 'false') ?: 'false').toBoolean()
def autografoAdmobBannerUnitId = autografoAds.getProperty(
        'admobBannerUnitId', 'ca-app-pub-3940256099942544/6300978111')
def autografoAdmobTestDeviceIds = autografoAds.getProperty('admobTestDeviceIds', '')

// Qt Creator "Sign package" injects android.injected.signing.* AND then
// androiddeployqt --sign the same artifact. Two signers → Play Store rejects
// the AAB ("more than one certificate chain"). For Play, leave Sign package
// unchecked and put the upload keystore in keystore.properties (gitignored).
def uploadKeystoreProps = new Properties()
def uploadKeystorePropsFile = file('keystore.properties')
if (uploadKeystorePropsFile.exists()) {
    uploadKeystorePropsFile.withInputStream { uploadKeystoreProps.load(it) }
}
def hasUploadSigning = (uploadKeystoreProps.getProperty('storeFile') ?: '').trim()

def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def buildingBundle = taskNames.any { it.contains('bundle') }

// Local APK deploy: debug keystore only when Gradle is not already signing
// and we are not building an AAB for Play.
def debugKeystoreFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
def useDebugReleaseSigning = !project.hasProperty('android.injected.signing.store.file') &&
        !hasUploadSigning && !buildingBundle

if (useDebugReleaseSigning && !debugKeystoreFile.exists()) {
    debugKeystoreFile.parentFile.mkdirs()
    def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    def keytoolName = System.getProperty('os.name').toLowerCase().contains('windows') ?
            'keytool.exe' : 'keytool'
    def keytool = new File(javaHome, "bin/${keytoolName}")
    if (keytool.exists()) {
        def proc = [
            keytool.absolutePath,
            '-genkeypair', '-keystore', debugKeystoreFile.absolutePath,
            '-storepass', 'android', '-alias', 'androiddebugkey',
            '-keypass', 'android', '-keyalg', 'RSA', '-keysize', '2048',
            '-validity', '10000', '-dname', 'CN=Android Debug,O=Android,C=US'
        ].execute()
        proc.waitFor()
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.16.0'
    if (autografoEnableAds) {
        implementation 'com.google.android.gms:play-services-ads:24.7.0'
        implementation 'androidx.browser:browser:1.8.0'
    }
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    // androidPackageName comes from QT_ANDROID_PACKAGE_NAME (br.pushx.autograph).
    // That is the Play Store application id. Java classes stay in
    // com.autografo.android and import br.pushx.autograph.R.
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            if (autografoEnableAds) {
                java.srcDirs += ['ads-src']
            }
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        // Do not compress Qt binary resources file
        noCompress 'rcc'
    }

    defaultConfig {
        // Qt templates often keep only "en". That strips Java overlay strings in
        // res/values-pt-rBR and res/values-es while C++ .qm translations still work.
        resConfigs "en", "es", "pt", "pt-rBR"
        applicationId "br.pushx.autograph"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
        if (autografoEnableAds) {
            resValue "string", "admob_banner_unit_id", autografoAdmobBannerUnitId
            resValue "string", "admob_test_device_ids", autografoAdmobTestDeviceIds
        }
    }

    signingConfigs {
        debugFallback {
            storeFile debugKeystoreFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            upload {
                storeFile file(hasUploadSigning)
                storePassword uploadKeystoreProps.getProperty('storePassword')
                keyAlias uploadKeystoreProps.getProperty('keyAlias')
                keyPassword uploadKeystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.upload
            } else if (useDebugReleaseSigning && debugKeystoreFile.exists()) {
                signingConfig signingConfigs.debugFallback
            }
        }
    }
}

// androiddeployqt --release without --sign always installs *-release-unsigned.apk.
// Gradle emits *-release.apk when any signingConfig is set (debug or upload),
// so copy that artifact to the name Qt Creator expects. Bundle/AAB is unaffected.
tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def outDir = file("${buildDir}/outputs/apk/release")
            if (!outDir.exists()) {
                return
            }
            def signed = outDir.listFiles()?.find {
                it.name.endsWith('-release.apk') && !it.name.contains('unsigned')
            }
            if (signed == null) {
                return
            }
            def unsignedName = signed.name.replace('-release.apk', '-release-unsigned.apk')
            java.nio.file.Files.copy(
                    signed.toPath(),
                    new File(outDir, unsignedName).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
